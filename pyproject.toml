[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safeincave"
dynamic = ["version"]
description = "A multiphysics finite element simulator for salt cavern"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{name = "Hermínio T. Honório"}]
maintainers = [
    {name = "SafeInCave Developers"},
]
license = { text = "BSD-3-Clause" }

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "numpy==1.26.4",
  "torch==2.4.0",
  "meshio==3.3.1",
  "gmsh==4.15.2",
  "lxml==6.1.1",
  "h5py==3.16.0",
  "skops==0.14.0",
  "ruff==0.15.17",
  "scikit-learn==1.7.2",
  "CoolProp==7.2.0",
  "scipy==1.14.1",
  "PyYAML==6.0.3",
]

[project.scripts]
sic = "safeincave.cli:main"

[project.optional-dependencies]
# Enables derivative_method="jax_ad". Pinned below 0.4.36, which requires
# numpy>=2 and so conflicts with the numpy==1.26.4 / dolfinx 0.9.0 pins above.
jax = [
  "jax[cpu]==0.4.35",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "pymdown-extensions",
  "mkdocs-caption",
  "mkdocstrings[python]",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "safeincave.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["safeincave*"]

[tool.setuptools.package-data]
"safeincave" = ["app/assets/*.png", "Utils/model_h.skops"]

[project.urls]
Repository = "https://github.com/ADMIRE-Public/SafeInCave"

[tool.ruff.lint]
# E402: module level import not at top - extensions.install() must run before imports
# F403: unable to detect undefined names from wildcard import - used for constitutive model auto-discovery
# N999: project convention uses PascalCase module names (e.g. Grid.py, IO.py) throughout
ignore = ["E402", "F403", "N999"]
